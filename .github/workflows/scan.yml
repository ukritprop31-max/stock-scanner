name: สแกนหุ้นรายวัน

on:
  schedule:
    # เวลาเป็น UTC: 03:15 UTC = 10:15 น. ไทย (เช้า — ตลาดไทยเปิดแล้ว, จีน/ฮ่องกงช่วงเช้า)
    #               11:20 UTC = 18:20 น. ไทย (หลังตลาดไทย/ฮ่องกงปิด)
    #               14:30 UTC = 21:30 น. ไทย (ตลาดสหรัฐฯ เพิ่งเปิด, ยุโรปช่วงบ่าย)
    #               21:50 UTC = 04:50 น. ไทย (หลังตลาดสหรัฐฯ ปิด)
    - cron: "15 3 * * 1-5"
    - cron: "20 11 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "50 21 * * 1-5"
  workflow_dispatch: {}      # กดรันเองได้จากแท็บ Actions
  push:
    branches: [main]       # แก้โค้ดแล้วสแกน+อัปเดตเว็บทันที

permissions:
  contents: write      # ให้บันทึกรายชื่อ DR ที่อัปเดตกลับเข้า repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: สแกน
        run: python scan.py
      - name: บันทึกรายชื่อ DR / คู่หุ้น A-H ล่าสุด (ถ้ามีเปลี่ยน)
        run: |
          git add -N ah_pairs.json 2>/dev/null || true
          if ! git diff --quiet -- thai_dr_list.json ah_pairs.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add thai_dr_list.json ah_pairs.json 2>/dev/null || git add thai_dr_list.json
            git commit -m "อัปเดตรายชื่อ DR / คู่หุ้น A-H"
            git push || echo "push ไม่สำเร็จ — รอบหน้าจะลองใหม่"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
